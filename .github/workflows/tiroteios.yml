# Tiroteios recentes (Fogo Cruzado) para o aviso de comunidade do GPS do
# Guia do Motorista. A cada 10 minutos busca as ocorrências do Rio das
# últimas 6 horas e publica tiroteios.json no branch "tiroteios" (um commit
# só, sobrescrito: não enche o histórico nem o GitHub Pages). O app lê em
# https://raw.githubusercontent.com/Wallyngton/guia-motorista-linhas/tiroteios/tiroteios.json
# Credenciais SÓ nos segredos: FOGOCRUZADO_EMAIL e FOGOCRUZADO_SENHA.

name: Tiroteios recentes

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tiroteios
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Buscar no Fogo Cruzado
        env:
          FOGOCRUZADO_EMAIL: ${{ secrets.FOGOCRUZADO_EMAIL }}
          FOGOCRUZADO_SENHA: ${{ secrets.FOGOCRUZADO_SENHA }}
        run: |
          mkdir -p /tmp/saida
          node ferramentas/tiroteios.mjs /tmp/saida/tiroteios.json
      - name: Publicar no branch tiroteios
        run: |
          if [ ! -f /tmp/saida/tiroteios.json ]; then echo "sem arquivo (sem credenciais)"; exit 0; fi
          cd /tmp/saida
          git init -q
          git config user.name "tiroteios"
          git config user.email "tiroteios@users.noreply.github.com"
          git checkout -q -b tiroteios
          git add tiroteios.json
          git commit -qm "Tiroteios recentes $(date -u +%Y-%m-%dT%H:%MZ)"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -qf origin tiroteios
