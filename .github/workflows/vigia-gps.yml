# Vigia do GPS da Prefeitura: a cada 5 minutos testa os endereços de GPS
# dos ônibus (fontes_gps.json) e marca em "melhor" o que tem mais ônibus.
# O app lê esse arquivo e troca sozinho, sem gastar internet do celular.
# Só salva quando a escolha muda (não enche o repositório de mudanças).

name: Vigia do GPS da Prefeitura

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vigia-gps
  cancel-in-progress: false

jobs:
  vigiar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pegar os arquivos do repositório
        uses: actions/checkout@v4

      - name: Testar os endereços do GPS
        id: teste
        run: python3 ferramentas/vigia_gps.py

      - name: Publicar a escolha (só quando mudou)
        if: steps.teste.outputs.mudou == 'true'
        run: |
          git config user.name "vigia-gps"
          git config user.email "vigia-gps@users.noreply.github.com"
          git add fontes_gps.json
          git commit -m "Vigia do GPS: agora o melhor é ${{ steps.teste.outputs.escolhida }}"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
